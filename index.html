    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background: #000;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        /* 100% Tam Ekran Gerçek TV Yayını (Butonsuz, Saf Video) */
        .tv-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
        }

        .tv-screen iframe, .tv-screen #ytplayer {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100vw;
            height: 56.25vw; /* 16:9 oranında tam ekran */
            min-height: 100vh;
            min-width: 177.77vh; /* 16:9 oranında tam ekran */
            transform: translate(-50%, -50%);
            border: none;
            outline: none;
            pointer-events: auto;
        }

        /* Gerçek TV Kanalı Köşe Logosu (KEMAL SUNAL TV) */
        .tv-logo {
            position: absolute;
            top: 24px;
            right: 28px;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 13px;
            font-weight: 900;
            letter-spacing: 2px;
            color: rgba(245, 197, 24, 0.85);
            text-shadow: 0 2px 8px rgba(0,0,0,0.9);
            pointer-events: none;
            user-select: none;
        }

        .tv-live-dot {
            width: 8px;
            height: 8px;
            background-color: #ef4444;
            border-radius: 50%;
            box-shadow: 0 0 8px #ef4444;
            animation: tv-blink 1.5s infinite;
        }

        @keyframes tv-blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>

    </div>

    <!-- Kanal Logosu -->

        ];

        let player = null;
        let currentIdx = 0;

        // Gerçek Dünya Saatiyle Eşit Canlı Yayın Hesaplama (Filmin ortasından başlar)
        function getLiveBroadcast() {
            const totalDuration = MOVIES.reduce((acc, m) => acc + m[1], 0);
            const now = Math.floor(Date.now() / 1000);
            let timeInCycle = now % totalDuration;

            for (let i = 0; i < MOVIES.length; i++) {
                const dur = MOVIES[i][1];
                if (timeInCycle < dur) {
                    return {
                        index: i,
                        id: MOVIES[i][0],
                        startSeconds: Math.floor(timeInCycle)
                    };
                }
                timeInCycle -= dur;
            }
            return { index: 0, id: MOVIES[0][0], startSeconds: 0 };
        }

        function onYouTubeIframeAPIReady() {
            const live = getLiveBroadcast();
            currentIdx = live.index;

            player = new YT.Player('ytplayer', {
                videoId: live.id,
                playerVars: {
                    autoplay: 1,
                    controls: 0,
                    disablekb: 1,
                    fs: 0,
                    modestbranding: 1,
                    rel: 0,
                    playsinline: 1,
                    iv_load_policy: 3,
                    start: live.startSeconds // O anki canlı saniyesinden başlar
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange,
                    'onError': onPlayerError
                }
            });
        }

        function onPlayerReady(event) {
            if (player.setPlaybackQuality) {
                player.setPlaybackQuality('hd1080');
            }
            // Otomatik başlatma
            const p = player.playVideo();
            if (p && p.catch) {
                p.catch(() => {
                    player.mute();
                    player.playVideo();
                });
            }
        }

        // Film bitince sıradakine otomatik geç (7/24 döngü)
        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                if (player.setPlaybackQuality) {
                    player.setPlaybackQuality('hd1080');
                }
            } else if (event.data === YT.PlayerState.ENDED) {
                currentIdx = (currentIdx + 1) % MOVIES.length;
                player.loadVideoById({
                    videoId: MOVIES[currentIdx][0],
                    startSeconds: 0,
                    suggestedQuality: 'hd1080'
                });
            }
        }

        function onPlayerError(event) {
            currentIdx = (currentIdx + 1) % MOVIES.length;
            player.loadVideoById({
                videoId: MOVIES[currentIdx][0],
                startSeconds: 0,
                suggestedQuality: 'hd1080'
            });
        }

        // Ekrana ilk dokunulduğunda ses kapalıysa sesi aç
        window.addEventListener('click', () => {
            if (player && player.isMuted && player.isMuted()) {
                player.unMute();
            }
        }, { once: true });
    </script>
