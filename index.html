<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kemal Sunal TV | 7/24 Canlı Yayın</title>
    
    <link rel="preconnect" href="https://www.youtube.com" crossorigin>
    <link rel="preconnect" href="https://i.ytimg.com" crossorigin>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background: #000;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #fff;
        }

        /* 100% Tam Ekran TV Ekranı */
        .tv-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
        }

        .tv-screen iframe {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100vw;
            height: 56.25vw;
            min-height: 100vh;
            min-width: 177.77vh;
            transform: translate(-50%, -50%);
            border: none;
            outline: none;
            pointer-events: auto;
        }

        /* TV Kanal Logosu */
        .tv-logo {
            position: absolute;
            top: 24px;
            right: 28px;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 900;
            letter-spacing: 2px;
            color: rgba(245, 197, 24, 0.9);
            text-shadow: 0 2px 8px rgba(0,0,0,0.9);
            pointer-events: none;
            user-select: none;
            background: rgba(0, 0, 0, 0.5);
            padding: 6px 14px;
            border-radius: 20px;
            backdrop-filter: blur(8px);
        }

        .tv-live-dot {
            width: 8px;
            height: 8px;
            background-color: #ef4444;
            border-radius: 50%;
            box-shadow: 0 0 8px #ef4444;
            animation: tv-blink 1.5s infinite;
        }

        @keyframes tv-blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Sesi Aç Floating Rozeti (Eğer Tarayıcı Sesi Kısarak Başlattıysa) */
        .unmute-badge {
            position: absolute;
            top: 24px;
            left: 28px;
            z-index: 20;
            display: none;
            align-items: center;
            gap: 8px;
            background: rgba(245, 197, 24, 0.95);
            color: #000;
            font-size: 13px;
            font-weight: 800;
            padding: 8px 18px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(245, 197, 24, 0.5);
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        /* Tıklama Yakalayıcı (Ekrana tek dokunuşla sesi açar) */
        .click-layer {
            position: absolute;
            inset: 0;
            z-index: 5;
            cursor: pointer;
            background: transparent;
        }

        .click-layer.disabled {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Video Alanı -->
    <div class="tv-screen">
        <iframe id="tvFrame" 
                allow="autoplay; encrypted-media; fullscreen" 
                allowfullscreen>
        </iframe>
    </div>

    <!-- Tıklama Katmanı (İlk tıklamada sesi açar ve kaybolur) -->
    <div class="click-layer" id="clickLayer"></div>

    <!-- Kanal Logosu -->
    <div class="tv-logo">
        <div class="tv-live-dot"></div>
        <span>KEMAL SUNAL TV</span>
    </div>

    <!-- Sesi Aç Rozeti -->
    <div class="unmute-badge" id="unmuteBadge">
        <span>🔊</span>
        <span>SESİ AÇMAK İÇİN TIKLAYIN</span>
    </div>

    <script>
        const SCHEDULE = [["guqpuNWQDhc", 5139, "Tosun Paşa"], ["rRDBKB6NHuY", 5323, "Şark Bülbülü"], ["ZDoLID8feBU", 5413, "Şaban Oğlu Şaban"], ["KRy20M7uQM4", 4833, "Süt Kardeşler"], ["stOXnCPxOws", 5014, "Kibar Feyzo"], ["xs9XUjHvZsM", 4750, "Çöpçüler Kralı"], ["R7ttwk9kQ8s", 5023, "Kapıcılar Kralı 1976 & Sevda Ferdağ"], ["-25lN6CGI1I", 4589, "Korkusuz Korkak Turkish Movie"], ["BTh074l83vI", 4585, "Sahte Kabadayı"], ["gPbAredRRqw", 4989, "Yedi Bela Hüsnü Oya Aydoğan"], ["wmPSBa1SRA4", 4888, "Üç Kağıtçı"], ["bcge5mSX090", 5642, "Davaro &"], ["RCcO3Zh4ths", 5611, "Şendul Şaban Türk Film"], ["w9wgwBM3pQo", 4923, "Postacı Eski"], ["IpNb0BwkI2M", 5131, "Ortadirek Şaban Eski"], ["GOZ7Waq9VkQ", 4708, "Tokatçı"], ["T0lBFkkEY3A", 5142, "Doktor Civanım 😎"], ["csbsGPMmKDY", 5059, "Kılıbık Eski"], ["G7oxi4tq0Bk", 4949, "Atla Gel Şaban"], ["XrpZje7tPd4", 4313, "Şaşkın Damat"], ["fPkQ_2dQRUw", 5169, "İnek Şaban"], ["hHNdISbONpk", 4723, "Devlet Kuşu Eski"], ["lTf-lxBbeFY", 5001, "Gerzek Şaban"], ["zRGKIhBg-Rk", 5450, "Deli Deli Küpeli Eski"], ["GySuqiTfZcw", 5342, "Japon İşi"], ["8eSZHKpr4Kg", 5147, "Sevimli Hırsız Türk Film"], ["qkgAExh2WBw", 5416, "Uyanık Gazeteci"], ["eN41guxlp0c", 5827, "Öğretmen Eski"], ["RPBofKLiBzU", 5183, "Polizei"], ["WdGv4-VTCLI", 6414, "Talih Kuşu , Yasemin Yalçın"], ["So6b5qua_zc", 5428, "Gülen Adam"], ["lH977qBfMKc", 5429, "Gülen Adam Full"], ["4rAnNKCxlnc", 5741, "Hababam Sınıfı Uyanıyor"], ["hf2-8MRPGu8", 5110, "Hababam Sınıfı (1975)"], ["6M2N1dztNU0", 5542, "Hababam Sınıfı Sınıfta Kaldı"], ["3Y8nUzSbTrE", 5812, "Hababam Sınıfı Tatilde"], ["0aPemUexAk4", 4587, "Mavi Boncuk"], ["5Q_wKlkCJsU", 5493, "Tatlı Dillim"], ["lSu7Wc5lgXc", 5115, "Salako"], ["yM2r8H8A_P0", 4911, "Köyden İndim Şehire"], ["wgG6xlQ1jx8", 4907, "Salak Milyoner"], ["4J3ulqHkgRM", 4898, "Sakar Şaki̇r"], ["xfn2PgMDYxw", 4616, "Yoksul 1986 & Yaman Okay"], ["eedUtTFLYsQ", 5879, "Şabani̇ye"], ["w7bwBts_d1U", 5371, "Güllü Geliyor Güllü"], ["zLc3Eh7uO2s", 4735, "Dokunmayın Şabanıma Esk         let currentIdx = 0;
        let player = null;

        // Gerçek Dünya Saatiyle Eşit Canlı Yayın Hesaplama
        function getLiveBroadcast() {
            const totalDuration = SCHEDULE.reduce((acc, m) => acc + m[1], 0);
            const now = Math.floor(Date.now() / 1000);
            let timeInCycle = now % totalDuration;

            for (let i = 0; i < SCHEDULE.length; i++) {
                const dur = SCHEDULE[i][1];
                if (timeInCycle < dur) {
                    return {
                        index: i,
                        id: SCHEDULE[i][0],
                        startSeconds: Math.floor(timeInCycle),
                        title: SCHEDULE[i][2]
                    };
                }
                timeInCycle -= dur;
            }
            return { index: 0, id: SCHEDULE[0][0], startSeconds: 0, title: SCHEDULE[0][2] };
        }

        const live = getLiveBroadcast();
        currentIdx = live.index;

        // ÖNEMLİ: mute=1 ile başlatıyoruz!
        // Böylece tarayıcı asla takılmaz, kırmızı oynat butonunda beklemez, ANINDA OYNATIR!
        const frame = document.getElementById('tvFrame');
        frame.src = `https://www.youtube.com/embed/${live.id}?autoplay=1&mute=1&controls=0&playsinline=1&rel=0&modestbranding=1&enablejsapi=1&start=${live.startSeconds}`;

        // YouTube Iframe API ile ses ve sonraki film kontrolü
        window.onYouTubeIframeAPIReady = function() {
            player = new YT.Player('tvFrame', {
                events: {
                    'onReady': function(e) {
                        if (player.setPlaybackQuality) player.setPlaybackQuality('hd1080');
                        player.playVideo();

                        // Doğrudan sesi açmayı dene (IPTV ve TV tarayıcıları izin verir!)
                        try {
                            player.unMute();
                        } catch(err) {}

                        // Eğer tarayıcı sesi engellediyse "Sesi Aç" uyarısını göster
                        setTimeout(() => {
                            if (player.isMuted && player.isMuted()) {
                                document.getElementById('unmuteBadge').style.display = 'flex';
                            }
                        }, 1500);
                    },
                    'onStateChange': function(e) {
                        if (e.data === YT.PlayerState.PLAYING) {
                            if (player.isMuted && !player.isMuted()) {
                                document.getElementById('unmuteBadge').style.display = 'none';
                                document.getElementById('clickLayer').classList.add('disabled');
                            }
                        } else if (e.data === YT.PlayerState.ENDED) {
                            playNext();
                        }
                    },
                    'onError': function() {
                        playNext();
                    }
                }
            });
        };

        function playNext() {
            currentIdx = (currentIdx + 1) % SCHEDULE.length;
            const nextMovie = SCHEDULE[currentIdx];

            if (player && player.loadVideoById) {
                player.loadVideoById({
                    videoId: nextMovie[0],
                    startSeconds: 0,
                    suggestedQuality: 'hd1080'
                });
            } else {
                frame.src = `https://www.youtube.com/embed/${nextMovie[0]}?autoplay=1&mute=1&controls=0&playsinline=1&rel=0&modestbranding=1&enablejsapi=1`;
            }
        }

        // Ekranda herhangi bir yere tıklandığında sesi aç
        function unmuteAudio() {
            if (player) {
                player.unMute();
                document.getElementById('unmuteBadge').style.display = 'none';
                document.getElementById('clickLayer').classList.add('disabled');
            }
        }

        document.getElementById('clickLayer').addEventListener('click', unmuteAudio);
        document.getElementById('unmuteBadge').addEventListener('click', unmuteAudio);
        window.addEventListener('keydown', unmuteAudio, { once: true });

        // API scriptini asenkron yükle
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        document.head.appendChild(tag);
    </script>
</body>
</html>
