            font-weight: 800;
            color: #fff;

        let player = null;
        let currentIndex = 0;
        let isShuffle = false;
        let osdTimeout = null;
        let userInteracted = false;

        // Load saved movie index or pick random
        const savedIndex = localStorage.getItem('kstv_current_index');
        if (savedIndex !== null && !isNaN(savedIndex) && savedIndex >= 0 && savedIndex < MOVIES.length) {
            currentIndex = parseInt(savedIndex);
        }

        // YouTube API Ready
        function onYouTubeIframeAPIReady() {
            const current = MOVIES[currentIndex];
            player = new YT.Player('ytplayer', {
                videoId: current.id,
                playerVars: {
                    autoplay: 1,
                    controls: 0,
                    disablekb: 1,
                    fs: 0,
                    modestbranding: 1,
                    rel: 0,
                    playsinline: 1,
                    iv_load_policy: 3
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange,
                    'onError': onPlayerError
                }
            });
        }

        function onPlayerReady(event) {
            // Set 1080p full quality
            if (player.setPlaybackQuality) {
                player.setPlaybackQuality('hd1080');
            }
            player.playVideo();
            updateOSD();
            renderGuide();
            resetOsdTimer();
        }

        // Automatic 24/7 transition when video ends
        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                if (player.setPlaybackQuality) {
                    player.setPlaybackQuality('hd1080');
                }
                updateOSD();
                resetOsdTimer();
            } else if (event.data === YT.PlayerState.ENDED) {
                // Seamlessly play next movie!
                playNextMovie();
            }
        }

        function onPlayerError(event) {
            console.warn('Video hatası, sıradaki filme geçiliyor...', event.data);
            setTimeout(playNextMovie, 1500);
        }

        function playMovieByIndex(index) {
            if (index < 0 || index >= MOVIES.length) index = 0;
            currentIndex = index;
            localStorage.setItem('kstv_current_index', currentIndex);

            const movie = MOVIES[currentIndex];
            if (player && player.loadVideoById) {
                player.loadVideoById({
                    videoId: movie.id,
                    suggestedQuality: 'hd1080'
                });
            }

            updateOSD();
            highlightGuideItem();
            showOSD();
            resetOsdTimer();
        }

        function playNextMovie() {
            if (isShuffle) {
                let nextIdx = Math.floor(Math.random() * MOVIES.length);
                if (nextIdx === currentIndex) nextIdx = (nextIdx + 1) % MOVIES.length;
                playMovieByIndex(nextIdx);
            } else {
                playMovieByIndex((currentIndex + 1) % MOVIES.length);
            }
        }

        function updateOSD() {
            const current = MOVIES[currentIndex];
            const nextIdx = (currentIndex + 1) % MOVIES.length;
            const nextMovie = MOVIES[nextIdx];

            document.getElementById('osdTitle').textContent = current.title;
            document.getElementById('osdIndexBadge').textContent = `(${currentIndex + 1} / ${MOVIES.length})`;
            document.getElementById('osdNextTitle').textContent = `Sıradaki: ${nextMovie.title}`;
            document.title = `📺 ${current.title} | Kemal Sunal TV`;
        }

        function showOSD() {
            const osd = document.getElementById('tvOsd');
            osd.classList.remove('hidden');
        }

        function hideOSD() {
            const osd = document.getElementById('tvOsd');
            osd.classList.add('hidden');
        }

        function resetOsdTimer() {
            showOSD();
            if (osdTimeout) clearTimeout(osdTimeout);
            osdTimeout = setTimeout(() => {
                hideOSD();
            }, 6000);
        }

        // Wake OSD on mouse move, touch or key press
        window.addEventListener('mousemove', resetOsdTimer);
        window.addEventListener('touchstart', resetOsdTimer);

        // Guide rendering
        function renderGuide(filterText = '') {
            const list = document.getElementById('guideList');
            list.innerHTML = '';
            const query = filterText.toLowerCase().trim();

            MOVIES.forEach((movie, idx) => {
                if (query && !movie.title.toLowerCase().includes(query)) return;

                const item = document.createElement('div');
                item.className = 'guide-item' + (idx === currentIndex ? ' active' : '');
                item.id = 'guide-item-' + idx;
                item.innerHTML = `
                    <img class="guide-thumb" src="https://img.youtube.com/vi/${movie.id}/hqdefault.jpg" alt="${movie.title}">
                    <div class="guide-item-title">${idx + 1}. ${movie.title}</div>
                `;

                item.addEventListener('click', () => {
                    playMovieByIndex(idx);
                    document.getElementById('guideDrawer').classList.remove('open');
                });

                list.appendChild(item);
            });
        }

        function highlightGuideItem() {
            document.querySelectorAll('.guide-item').forEach(it => it.classList.remove('active'));
            const active = document.getElementById('guide-item-' + currentIndex);
            if (active) {
                active.classList.add('active');
                active.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        // Guide events
        document.getElementById('btnGuide').addEventListener('click', (e) => {
            e.stopPropagation();
            document.getElementById('guideDrawer').classList.add('open');
            highlightGuideItem();
        });

        document.getElementById('btnCloseGuide').addEventListener('click', () => {
            document.getElementById('guideDrawer').classList.remove('open');
        });

        document.getElementById('guideSearchInput').addEventListener('input', (e) => {
            renderGuide(e.target.value);
        });

        // Controls
        document.getElementById('btnNext').addEventListener('click', (e) => {
            e.stopPropagation();
            playNextMovie();
        });

        const btnShuffle = document.getElementById('btnShuffle');
        btnShuffle.addEventListener('click', (e) => {
            e.stopPropagation();
            isShuffle = !isShuffle;
            btnShuffle.classList.toggle('active', isShuffle);
            resetOsdTimer();
        });

        document.getElementById('btnFullscreen').addEventListener('click', (e) => {
            e.stopPropagation();
            toggleFullscreen();
        });

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
            }
        }

        // Unmute Overlay
        const unmuteOverlay = document.getElementById('unmuteOverlay');
        unmuteOverlay.addEventListener('click', () => {
            userInteracted = true;
            unmuteOverlay.classList.add('hidden');
            if (player) {
                player.unMute();
                player.playVideo();
                if (player.setPlaybackQuality) {
                    player.setPlaybackQuality('hd1080');
                }
            }
            resetOsdTimer();
        });

        // Keyboard & TV Remote Navigation
        window.addEventListener('keydown', (e) => {
            resetOsdTimer();
            if (e.target.tagName === 'INPUT') return;

            if (e.key === 'ArrowRight' || e.key === 'n' || e.key === 'N') {
                playNextMovie();
            } else if (e.key === 'f' || e.key === 'F') {
                toggleFullscreen();
            } else if (e.key === 's' || e.key === 'S') {
                isShuffle = !isShuffle;
                btnShuffle.classList.toggle('active', isShuffle);
            } else if (e.key === 'l' || e.key === 'L') {
                document.getElementById('guideDrawer').classList.toggle('open');
            } else if (e.key === 'Escape') {
                document.getElementById('guideDrawer').classList.remove('open');
            }
        });

        // Initial setup
        updateOSD();
    </script>
